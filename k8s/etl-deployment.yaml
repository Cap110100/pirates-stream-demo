apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etl
  template:
    metadata:
      labels:
        app: etl
    spec:
      containers:
        - name: etl
          image: pirates-etl:1.0
          imagePullPolicy: Never
          env:
            - name: KAFKA_BROKER
              value: "host.docker.internal:29092"
            - name: KAFKA_TOPIC
              value: "player-events"
            - name: PG_HOST
              value: "host.docker.internal"
            - name: PG_PORT
              value: "62000"
            - name: PG_DB
              value: "streamdb"
            - name: PG_USER
              value: "postgres"
            - name: PG_PASSWORD
              value: "postgres"
            - name: S3_ENDPOINT
              value: "http://host.docker.internal:9000"
            - name: S3_ACCESS_KEY
              value: "minioadmin"
            - name: S3_SECRET_KEY
              value: "minioadmin"
            - name: S3_BUCKET
              value: "pirates-raw"